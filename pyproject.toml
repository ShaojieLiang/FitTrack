[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fittrack-coach"
version = "0.1.0"
description = "Training analytics and forecasting with user-configured private server endpoints"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4", "pillow>=11,<14"]

[project.scripts]
fittrack = "fittrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
